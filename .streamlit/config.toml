# ==========================================================================
# Apariencia SIO — Sistema Integral de Operaciones
# Islas Gower & Compañía Sucesores S. en C. de C.V.
#
# Los valores salen del sistema de diseño de `sio_islas`
# (app/globals.css), que a su vez toma la paleta de `sio-tracking`:
#     $brand-color: #1b2958   |   $text-color: rgb(0, 61, 166)
#
# Aquí sólo viven los tokens que Streamlit entiende de forma nativa. Lo que
# el tema no alcanza —cabecera de marca, tarjetas, pestañas— se pinta con el
# CSS de `sio_tema.py`.
# ==========================================================================

[server]
# Sirve ./static en /app/static/: de ahí salen las tipografías Geist, para
# que la app no dependa de una CDN.
enableStaticServing = true
# Sin esto, el primer arranque se queda esperando un correo en la terminal.
headless = true

[browser]
gatherUsageStats = false

# --- Tipografías ---------------------------------------------------------
# Geist y Geist Mono, las mismas del panel de SIO. Son variables: un solo
# archivo cubre de 100 a 900.

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-ext.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geist-mono-latin.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geist-mono-latin-ext.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

# --- Formas y tipografía base -------------------------------------------

[theme]
font = "Geist"
headingFont = "Geist"
codeFont = "Geist Mono"
baseFontSize = 15

# --sio-radius: 0.75rem / botones 0.5rem
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

# Los títulos del panel: 1.375rem y peso 700 (.sio-heading__title)
headingFontSizes = ["1.75rem", "1.375rem", "1.0625rem", "0.9375rem", "0.875rem", "0.8125rem"]
headingFontWeights = [700, 700, 700, 700, 700, 700]
metricValueFontWeight = 700

# Gráficas. Streamlit sólo admite un juego —no acepta estos tokens dentro de
# [theme.light] / [theme.dark]—, así que van los pasos que el sistema de
# diseño validó: #0a5bd3 pasa banda de luminosidad y contraste sobre la
# tarjeta clara, y sigue leyéndose sobre la oscura.
chartCategoricalColors = ["#0a5bd3", "#1b2958", "#0090ff", "#029500", "#b26a00", "#c10000"]
chartSequentialColors = ["#eef4ff", "#d6e4ff", "#a9c6ff", "#7aa5f5", "#4b81e6", "#0a5bd3", "#003da6", "#25366e", "#1b2958"]

# --- Claro: el modo de siempre del panel --------------------------------

[theme.light]
primaryColor = "#003da6"          # --sio-blue
backgroundColor = "#f5f9ff"       # --sio-surface (lienzo)
secondaryBackgroundColor = "#ffffff"  # --sio-card
textColor = "#16233f"             # --sio-ink
linkColor = "#003da6"
borderColor = "#e4e9f2"           # --sio-line
dataframeBorderColor = "#e4e9f2"
dataframeHeaderBackgroundColor = "#eef4ff"  # --sio-blue-050
codeBackgroundColor = "#eef4ff"
codeTextColor = "#16233f"

# Estados: st.success / st.error / st.warning / st.info toman estos pares.
greenColor = "#029500"            # --sio-success
greenTextColor = "#029500"
greenBackgroundColor = "#e8f7e8"
redColor = "#c10000"              # --sio-danger
redTextColor = "#c10000"
redBackgroundColor = "#fdeaea"
orangeColor = "#b26a00"           # --sio-warning
orangeTextColor = "#b26a00"
orangeBackgroundColor = "#fdf3e3"
yellowColor = "#b26a00"
yellowTextColor = "#b26a00"
yellowBackgroundColor = "#fdf3e3"
blueColor = "#0090ff"             # --sio-info
blueTextColor = "#003da6"
blueBackgroundColor = "#e6f4ff"
violetColor = "#1b2958"           # --sio-navy
violetTextColor = "#1b2958"
violetBackgroundColor = "#d6e4ff"
grayColor = "#8f98ab"             # --sio-ink-muted
grayTextColor = "#5b6781"         # --sio-ink-soft
grayBackgroundColor = "#eef1f7"   # --sio-line-soft

# --- Oscuro: los mismos tokens, con la paleta que ya define el panel ----

[theme.dark]
primaryColor = "#3d86ef"
backgroundColor = "#0b1020"       # --sio-surface (oscuro)
secondaryBackgroundColor = "#141b2d"  # --sio-card
textColor = "#e8ecf6"             # --sio-ink
linkColor = "#3d86ef"
borderColor = "#26304a"           # --sio-line
dataframeBorderColor = "#26304a"
dataframeHeaderBackgroundColor = "#16224a"
codeBackgroundColor = "#16224a"
codeTextColor = "#e8ecf6"

greenColor = "#3fbf3d"
greenTextColor = "#7fd97d"
greenBackgroundColor = "#122c12"
redColor = "#ef4444"
redTextColor = "#ff8b8b"
redBackgroundColor = "#3a1414"
orangeColor = "#e0912a"
orangeTextColor = "#f0b45f"
orangeBackgroundColor = "#33230a"
yellowColor = "#e0912a"
yellowTextColor = "#f0b45f"
yellowBackgroundColor = "#33230a"
blueColor = "#3d86ef"
blueTextColor = "#8fbaf8"
blueBackgroundColor = "#16224a"
violetColor = "#8fa4e0"
violetTextColor = "#8fa4e0"
violetBackgroundColor = "#1d2f63"
grayColor = "#7b859c"             # --sio-ink-muted
grayTextColor = "#a7b0c4"         # --sio-ink-soft
grayBackgroundColor = "#1d2539"   # --sio-line-soft
